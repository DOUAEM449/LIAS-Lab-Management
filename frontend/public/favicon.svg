<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="LIAS">
  <!-- Marque LIAS : le « L » du logotype, tracé comme une piste de circuit
       imprimé. Reprend le noir bleuté et le cyan électrique du logo du
       laboratoire. Remplace l'ancien favicon violet, étranger à l'identité. -->
  <rect width="48" height="48" rx="11" fill="#1B2430"/>
  <g fill="none" stroke="#3FB8E8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hampe et pied du L -->
    <path d="M17 12v20h13"/>
    <!-- Dérivations de circuit sur la hampe -->
    <path d="M17 19h-5" opacity=".55"/>
    <path d="M17 26h-5" opacity=".55"/>
  </g>
  <g fill="#3FB8E8">
    <!-- Nœuds du circuit -->
    <circle cx="17" cy="12" r="2.6"/>
    <circle cx="30" cy="32" r="2.6"/>
    <circle cx="11" cy="19" r="1.7" opacity=".55"/>
    <circle cx="11" cy="26" r="1.7" opacity=".55"/>
  </g>
  <!-- Puce, clin d'œil au microprocesseur du logotype -->
  <rect x="31" y="14" width="7" height="7" rx="1.4" fill="none" stroke="#3FB8E8" stroke-width="2" opacity=".7"/>
</svg>
