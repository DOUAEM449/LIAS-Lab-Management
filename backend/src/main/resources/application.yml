spring:
  application:
    name: lab-management

  # Load local secrets/overrides from backend/.env (KEY=value, git-ignored) when present.
  # Three locations are tried so the app starts the same way whatever the working
  # directory is: `backend/` (mvn spring-boot:run) or the repository root (IDE run
  # configurations default to the project root).
  # Nothing breaks in CI / prod where the file is absent and real env vars are used instead.
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./backend/.env[.properties]
      - optional:file:../backend/.env[.properties]

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lias_lab_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: LiasHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    # Clé de signature HS512, obligatoire et sans valeur de repli : application.yml
    # s'applique à TOUS les profils, une valeur par défaut serait donc active en
    # production. En son absence le démarrage échoue, ce qui est le comportement
    # voulu — mieux vaut un serveur qui refuse de démarrer qu'un serveur qui signe
    # ses jetons avec une clé publiée dans le dépôt.
    # Générer : openssl rand -base64 72
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 3600000        # 1 hour
    refresh-token-expiration-ms: 604800000     # 7 days
    issuer: lias-lab-management
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  file-storage:
    base-dir: ${FILE_STORAGE_DIR:./uploads}
    max-size-mb: 25
  reports:
    # CdC 2.11 - automatic yearly generation of the activity report.
    # Runs on 1 January at 02:00 and closes the previous (now final) calendar year.
    annual-cron: ${REPORTS_ANNUAL_CRON:0 0 2 1 1 *}
    annual-zone: ${REPORTS_ANNUAL_ZONE:Africa/Casablanca}
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@lias-lab.ma}
  bootstrap:
    # First System Administrator account (dev profile only, and only on a database
    # that has none yet). Deliberately without a fallback value: when the variable is
    # absent nothing is seeded, so no environment ever gets an account with a
    # password that is known from the source code.
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.lias.labmanagement: DEBUG
    org.hibernate.SQL: WARN
