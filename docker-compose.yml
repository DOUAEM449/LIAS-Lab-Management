version: '3.8'

services:
  # Service 1: Database PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: lias_postgres
    environment:
      POSTGRES_DB: lias_lab_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lias_lab_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Service 2: Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lias_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lias_lab_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      # Required since the JWT signing key lost its fallback value: without it the backend
      # refuses to start. Set it in the shell or in a git-ignored .env next to this file
      # (generate one with: openssl rand -base64 72 | tr -d '\r\n'). Compose stops with this message if
      # it is missing, instead of starting a container that crashes.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - see README, section Configuration}
      # Optional: seeds admin@lias.ma on this fresh database (12 characters minimum, change
      # required at first sign-in). Left empty, no administrator account is created.
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Store uploads on the named volume below, so documents, CVs and avatars survive the
      # container being rebuilt or recreated.
      FILE_STORAGE_DIR: /app/uploads
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
  backend_uploads: