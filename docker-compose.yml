version: '3.8'

services:
  # Service 1: Database PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: lias_postgres
    environment:
      POSTGRES_DB: lias_lab_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lias_lab_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Service 2: Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lias_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lias_lab_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  postgres_data: